# Scraped every 15 s: the DockWell gateway, vLLM engines and (gpu profile) NVIDIA DCGM.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: dockwell-api
    metrics_path: /api/metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8000"]

  - job_name: llamacpp
    metrics_path: /metrics
    static_configs:
      - targets: ["llamacpp:8080"]

  - job_name: dcgm
    static_configs:
      - targets: ["dcgm-exporter:9400"]

  # Engines deployed from the admin area join the "dockwell" network with names
  # dockwell-engine-*; discover them through the Docker socket.
  - job_name: managed-engines
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        filters:
          - name: label
            values: ["dockwell.managed=true"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: engine
      - source_labels: [__meta_docker_network_name]
        regex: dockwell
        action: keep
